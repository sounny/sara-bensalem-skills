    <text x="840.0" y="591.0" class="mono-bold" font-size="10px" text-anchor="middle">11.5m</text>
    
    <!-- Zone Metadata Label -->
    <text x="840.0" y="695" class="mono-bold" font-size="11px" text-anchor="middle">Sunken Courtyard</text>
    <text x="840.0" y="710" class="mono-body" font-size="9px" text-anchor="middle">Subtractive Sky We</text>
    <text x="840.0" y="724" class="mono-body" font-size="8px" text-anchor="middle">Aswan Sandstone As</text>
    <!-- Zone 5: Memorial Core -->
    <rect x="1056.0" y="586.0" width="48" height="84.0" fill="#55544E" stroke="#111110" stroke-width="1.2" />
    <text x="1080.0" y="576.0" class="mono-bold" font-size="10px" text-anchor="middle">14.0m</text>
    
    <!-- Zone Metadata Label -->
    <text x="1080.0" y="695" class="mono-bold" font-size="11px" text-anchor="middle">Memorial Core</text>
    <text x="1080.0" y="710" class="mono-body" font-size="9px" text-anchor="middle">Acoustic Sanctuary</text>
    <text x="1080.0" y="724" class="mono-body" font-size="8px" text-anchor="middle">Porous Clay Earth </text>
