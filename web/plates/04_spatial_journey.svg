  <!-- Folio Footer -->
  <line x1="60" y1="750" x2="1140" y2="750" stroke="#DDD9D0" stroke-width="1" />
  <text x="60" y="775" class="mono-body">SARA BENSALEM STUDIO • PHENOMENOLOGICAL SPATIAL CHOREOGRAPHY • STRASBOURG ATELIER</text>
  <text x="1140" y="775" class="mono-bold" text-anchor="end">PLATE 04 // SPATIAL JOURNEY MATRIX</text>
</svg>