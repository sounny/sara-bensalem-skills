    <text x="360.0" y="710" class="mono-body" font-size="9px" text-anchor="middle">Compression & Dece</text>
    <text x="360.0" y="724" class="mono-body" font-size="8px" text-anchor="middle">Charred Oak Soffit</text>
    <!-- Zone 3: Subterranean Ramp -->
    <rect x="576.0" y="650.8" width="48" height="19.2" fill="#111110" stroke="#111110" stroke-width="1.2" />
    <text x="600.0" y="640.8" class="mono-bold" font-size="10px" text-anchor="middle">3.2m</text>
    
    <!-- Zone Metadata Label -->
    <text x="600.0" y="695" class="mono-bold" font-size="11px" text-anchor="middle">Subterranean Ramp</text>
    <text x="600.0" y="710" class="mono-body" font-size="9px" text-anchor="middle">Tactile Shadow & D</text>
    <text x="600.0" y="724" class="mono-body" font-size="8px" text-anchor="middle">Hemp-Lime Biotampi</text>
    <!-- Zone 4: Sunken Courtyard -->
