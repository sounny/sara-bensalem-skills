    <text x="90" y="22" class="mono-bold" fill="#FFFFFF" text-anchor="middle">VERDICT: REVISE</text>
  </g>

  <!-- Section 1: Luminance Gradient Chart (Lux) -->
  <g transform="translate(0, 0)">
