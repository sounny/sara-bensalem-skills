    <polyline points="120.0,140.0 360.0,234.8 600.0,263.0 840.0,247.5 1080.0,278.8" class="lux-line" />
    <circle cx="120.0" cy="140.0" r="5" fill="#E68A00" stroke="#FFFFFF" stroke-width="2" />
    <text x="120.0" y="128.0" class="mono-bold" font-size="10px" text-anchor="middle">100000 lx</text>
    <circle cx="360.0" cy="234.8" r="5" fill="#E68A00" stroke="#FFFFFF" stroke-width="2" />
    <text x="360.0" y="222.8" class="mono-bold" font-size="10px" text-anchor="middle">700 lx</text>
    <circle cx="600.0" cy="263.0" r="5" fill="#E68A00" stroke="#FFFFFF" stroke-width="2" />
