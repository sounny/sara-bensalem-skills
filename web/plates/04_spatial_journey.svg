    <circle cx="360.0" cy="492.8" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <text x="360.0" y="482.8" class="mono-bold" font-size="10px" text-anchor="middle">54 dBA</text>
    <circle cx="600.0" cy="529.2" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <text x="600.0" y="519.2" class="mono-bold" font-size="10px" text-anchor="middle">41 dBA</text>
    <circle cx="840.0" cy="565.6" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <text x="840.0" y="555.6" class="mono-bold" font-size="10px" text-anchor="middle">28 dBA</text>
    <circle cx="1080.0" cy="588.0" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
